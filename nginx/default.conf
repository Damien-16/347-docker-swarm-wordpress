# Configuration du serveur virtuel HTTP Nginx pour WordPress
server {
    # Port d'écoute pour le trafic web entrant HTTP
    listen 80;

    # Nom de domaine défini dans le cahier des charges et alias localhost
    server_name www.my-wordpress.ch localhost;

    # Racine du site où se trouvent les fichiers WordPress partagés
    root /var/www/html;

    # Fichiers d'index par défaut dans l'ordre de priorité
    index index.php index.html index.htm;

    # Gestion des requêtes courantes : vérifie le fichier, puis le dossier, puis renvoie vers index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Transmission des requêtes PHP au service WordPress (FPM) via FastCGI
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # 'wordpress' correspond au nom du service Swarm sur le port 9000 (PHP-FPM)
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Interdiction d'accès aux fichiers cachés (.htaccess, .env, .git, etc.)
    location ~ /\.ht {
        deny all;
    }

    # Optimisation du traitement de l'icône favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Autorisation et non-journalisation de robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
        allow all;
    }

    # Mise en cache navigateur des fichiers statiques (images, styles, scripts)
    location ~* \.(css|gif|ico|jpeg|jpg|js|png|webp|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }
}
