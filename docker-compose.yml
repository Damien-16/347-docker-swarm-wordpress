# ==============================================================================
# PROJET DEVOPS 347 - ETML : Déploiement de WordPress Haute Disponibilité avec Docker Swarm
# Fichier : docker-compose.yml
# Description : Définition de la stack Docker Swarm multi-conteneurs pour WordPress
# Images officielles requises : MariaDB 12.0.1, WordPress 6.8.2-fpm-alpine, Nginx 1.28.0-alpine3.21
# ==============================================================================

# Version du format du fichier Compose compatible Docker Swarm
version: '3.8'

# ------------------------------------------------------------------------------
# SECTION SERVICES : Définition des conteneurs applicatifs formant la stack
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # SERVICE 1 : Base de données relationnelle MariaDB
  # ----------------------------------------------------------------------------
  db:
    # Image officielle MariaDB demandée par le cahier des charges
    image: mariadb:12.0.1

    # Réseau d'attachement : uniquement le réseau backend pour isoler la DB d'Internet
    networks:
      - backend

    # Volumes de persistance des données pour garantir la non-perte en cas de redémarrage
    volumes:
      # Stockage persistant des tables et données MySQL/MariaDB
      - db_data:/var/lib/mysql

    # Variables d'environnement pour initialiser la base et la configuration utilisateur
    environment:
      # Nom de la base de données WordPress à créer au démarrage
      MARIADB_DATABASE: wordpress
      # Nom de l'utilisateur dédié utilisé par WordPress pour se connecter
      MARIADB_USER: wordpress
      # Emplacement du mot de passe utilisateur fourni via un secret Docker
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      # Emplacement du mot de passe root administrateur fourni via un secret Docker
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    # Secrets Docker injectés de façon chiffrée dans le conteneur sous /run/secrets/
    secrets:
      # Référence au secret contenant le mot de passe utilisateur
      - db_password
      # Référence au secret contenant le mot de passe root MariaDB
      - db_root_password

    # Paramètres de déploiement et d'orchestration pour Docker Swarm
    deploy:
      # Mode d'exécution répliqué (une seule instance pour éviter les conflits d'écriture DB)
      mode: replicated
      # Nombre d'instances en cours d'exécution
      replicas: 1
      # Contraintes de placement du service dans le cluster Swarm
      placement:
        constraints:
          # Exécution restreinte au nœud manager (où le stockage local persistant est présent)
          - node.role == manager
      # Politique de redémarrage automatique en cas d'incident
      restart_policy:
        # Redémarre uniquement si le conteneur subit un crash (code retour != 0)
        condition: on-failure
        # Délai d'attente avant tentative de relance
        delay: 5s
        # Nombre maximum de tentatives avant abandon
        max_attempts: 3
        # Fenêtre temporelle pour évaluer si le service a démarré avec succès
        window: 120s

  # ----------------------------------------------------------------------------
  # SERVICE 2 : Moteur applicatif WordPress (variante PHP-FPM ultra légère Alpine)
  # ----------------------------------------------------------------------------
  wordpress:
    # Image officielle WordPress FPM Alpine imposée par le cahier des charges
    image: wordpress:6.8.2-fpm-alpine

    # Connexion aux deux réseaux : backend pour joindre MariaDB et frontend pour communiquer avec Nginx
    networks:
      - backend
      - frontend

    # Montage du volume partagé pour le code source et les médias (uploads, thèmes, extensions)
    volumes:
      # Volume partagé accessible également par le service Nginx pour servir les assets statiques
      - wp_data:/var/www/html

    # Variables d'environnement pour l'initialisation et la liaison avec la base de données
    environment:
      # Hôte et port de la base de données (utilise le nom du service Docker Swarm 'db')
      WORDPRESS_DB_HOST: db:3306
      # Nom de la base de données WordPress à utiliser
      WORDPRESS_DB_NAME: wordpress
      # Nom du compte utilisateur de la base
      WORDPRESS_DB_USER: wordpress
      # Chemin vers le secret Docker contenant le mot de passe utilisateur
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password

    # Secret contenant le mot de passe de connexion à la base de données
    secrets:
      - db_password

    # Paramètres d'orchestration Swarm pour la haute disponibilité et tolérance aux pannes
    deploy:
      # Mode répliqué pour distribuer la charge applicative
      mode: replicated
      # Déploiement de 3 répliques pour assurer la redondance et la tolérance aux pannes
      replicas: 3
      # Configuration de la mise à jour progressive (Rolling Update) sans coupure de service
      update_config:
        # Mise à jour de 1 conteneur à la fois
        parallelism: 1
        # Délai d'attente entre la mise à jour de chaque réplique
        delay: 10s
        # Action en cas d'erreur de déploiement : retour arrière automatique
        failure_action: rollback
        # Ordre des opérations : démarrer le nouveau conteneur avant d'arrêter l'ancien
        order: start-first
      # Politique de redémarrage automatique
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ----------------------------------------------------------------------------
  # SERVICE 3 : Serveur Web & Reverse Proxy Nginx
  # ----------------------------------------------------------------------------
  nginx:
    # Image officielle Nginx Alpine demandée par le cahier des charges
    image: nginx:1.28.0-alpine3.21

    # Exposition des ports vers l'extérieur via l'Ingress Routing Mesh de Docker Swarm
    ports:
      # Port HTTP public 80 mappé sur le port interne 80 de Nginx
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

    # Réseau d'appartenance : uniquement frontend (aucun accès direct nécessaire vers MariaDB)
    networks:
      - frontend

    # Montages de volumes pour servir les fichiers statiques WordPress
    volumes:
      # Accès aux fichiers WordPress partagés en lecture seule pour sécuriser l'accès
      - wp_data:/var/www/html:ro

    # Injection du fichier de configuration Nginx via la fonctionnalité native Swarm Configs
    configs:
      # Source de la configuration définie plus bas
      - source: nginx_conf
        # Destination à l'intérieur du conteneur Nginx
        target: /etc/nginx/conf.d/default.conf

    # Paramètres de déploiement et tolérance aux pannes Swarm
    deploy:
      mode: replicated
      # 2 répliques Nginx réparties sur le cluster pour haute disponibilité frontale
      replicas: 2
      # Mise à jour sans interruption de service
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      # Politique de redémarrage
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

# ------------------------------------------------------------------------------
# SECTION NETWORKS : Définition des réseaux virtuels overlay isolés
# ------------------------------------------------------------------------------
networks:
  # Réseau frontend reliant le reverse proxy Nginx et le moteur WordPress
  frontend:
    # Driver overlay pour permettre la communication entre conteneurs sur des hôtes différents
    driver: overlay
    # Chiffrement optionnel des communications réseau entre nœuds
    driver_opts:
      encrypted: "true"

  # Réseau backend reliant WordPress et MariaDB (totalement isolé d'Internet)
  backend:
    driver: overlay
    driver_opts:
      encrypted: "true"

# ------------------------------------------------------------------------------
# SECTION VOLUMES : Définition des volumes de persistance de données
# ------------------------------------------------------------------------------
volumes:
  # Volume persistant dédié au stockage des fichiers de la base MariaDB
  db_data:
    driver: local

  # Volume partagé NFS pour les fichiers WordPress (code et répertoire uploads médias)
  # Ce volume garantit que toutes les répliques sur tous les nœuds accèdent aux mêmes médias
  wp_data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.20.130,rw,nolock,soft"
      device: ":/srv/nfs/wp_data"

# ------------------------------------------------------------------------------
# SECTION SECRETS : Déclaration des secrets gérés par Docker Swarm
# ------------------------------------------------------------------------------
secrets:
  # Secret externe préalablement créé avec la commande 'docker secret create db_password ...'
  db_password:
    external: true

  # Secret externe préalablement créé avec la commande 'docker secret create db_root_password ...'
  db_root_password:
    external: true

# ------------------------------------------------------------------------------
# SECTION CONFIGS : Déclaration des configurations gérées nativement par Swarm
# ------------------------------------------------------------------------------
configs:
  # Configuration Nginx chargée depuis le fichier local et distribuée automatiquement aux nœuds
  nginx_conf:
    file: ./nginx/default.conf
